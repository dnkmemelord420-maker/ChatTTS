<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TTS Encrypted Chat</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      --panel-bg: #f3f4f7;
      --panel-border: #d0d4db;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .hidden { display: none; }
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }

    /* Login */
    .error { color: #c00; margin: 6px 0; }

    /* Settings */
    #settingsToggle { margin-bottom: 8px; }
    #settingsPanel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px 12px;
    }
    #settingsPanel label { display: flex; align-items: center; gap: 6px; }
    #countdownDisplay { font-weight: 600; align-self: center; }

    /* Chat window (draggable + resizable) */
    #chatWindow {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 460px;
      height: 380px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      resize: both; /* user can resize */
    }
    #chatHeader {
      padding: 8px 10px;
      background: #fafafa;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: move; /* drag handle */
      user-select: none;
    }
    #chatTitle { font-weight: 600; font-size: 14px; color: #333; }
    #chat {
      flex: 1;
      overflow: auto;
      padding: 10px;
      /* no white outline: remove border entirely */
      border: none;
      background: #fff;
    }
    .message { margin: 6px 0; color: #222; }
    #chatFooter {
      padding: 10px;
      background: #fafafa;
      border-top: 1px solid #eee;
    }
    #chatForm, #imageForm {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin: 6px 0;
    }
    #username { grid-column: 1 / -1; }
    input[type="text"], input[type="url"], input[type="password"] {
      padding: 8px 10px;
      border: 1px solid #dadde4;
      border-radius: 6px;
    }
    button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #cfd6e2;
      background: #eef2f7;
      color: #111;
      cursor: pointer;
    }
    button:hover { background: #e6ebf3; }
    select, input[type="range"] {
      padding: 6px;
      border: 1px solid #dadde4;
      border-radius: 6px;
    }

    /* Page header title spacing */
    h1 { margin: 0 0 12px 0; font-size: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>TTS Encrypted Chat</h1>

    <!-- LOGIN -->
    <div id="login">
      <input id="loginPwd" type="password" placeholder="Enter chat password" />
      <button id="loginBtn">Enter</button>
      <p id="loginMsg" class="error"></p>
      <p id="sessionMsg" class="error"></p>
    </div>

    <!-- CHAT UI -->
    <div id="chat-ui" class="hidden">
      <button id="settingsToggle">Show Settings</button>
      <div id="settingsPanel" class="hidden">
        <label>
          Voice
          <select id="voiceSelect"></select>
        </label>
        <label>
          Volume
          <input id="volumeSlider" type="range" min="0" max="1" step="0.1" value="1" />
        </label>
        <button id="muteBtn">Mute</button>
        <button id="autoDeleteBtn">Start Auto-Delete</button>
        <span id="countdownDisplay"></span>
      </div>

      <!-- Draggable & resizable chat window -->
      <div id="chatWindow">
        <div id="chatHeader">
          <div id="chatTitle">Room</div>
          <div></div>
        </div>

        <div id="chat"></div>

        <div id="chatFooter">
          <form id="chatForm">
            <input id="username" type="text" placeholder="Your name" required maxlength="30" />
            <input id="message" type="text" placeholder="Type a message…" required maxlength="200" />
            <button type="submit">Send</button>
          </form>
          <form id="imageForm">
            <input id="imageLink" type="url" placeholder="Paste image link…" required />
            <button type="submit">Send Image</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyANG_bgIZ0sdpenEZdLU6zqAUvLpk2RH8s",
      authDomain: "chattts-574ab.firebaseapp.com",
      databaseURL: "https://chattts-574ab-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "chattts-574ab",
      storageBucket: "chattts-574ab.appspot.com",
      messagingSenderId: "848479057506",
      appId: "1:848479057506:web:a2dd895d7a7991387d433b"
    };

    const LOGIN_PASSWORD_HASH = "b9ff6bf20e4c06505ffc06e1f4059838936938cc83f0d2d02adcdae945d8f984";
    const CHAT_PASSPHRASE     = "ad3awd51affwrqw";
    const SALT                = "static-salt-123";

    const app     = initializeApp(firebaseConfig);
    const db      = getDatabase(app);
    const auth    = getAuth(app);
    const chatRef = ref(db, "messages");

    const sessionMsg = document.getElementById("sessionMsg");
    let authed = false;
    signInAnonymously(auth)
      .then(() => { authed = true; sessionMsg.textContent = ""; })
      .catch(() => { sessionMsg.textContent = "Secure session failed to initialize. Reload and try again."; });
    onAuthStateChanged(auth, (user) => { authed = !!user; });

    async function hashSHA256(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    document.getElementById("loginBtn").onclick = async () => {
      const pw   = document.getElementById("loginPwd").value;
      const hash = await hashSHA256(pw);
      if (hash === LOGIN_PASSWORD_HASH) {
        if (!authed) { sessionMsg.textContent = "Initializing secure session… try again in a second."; return; }
        document.getElementById("login").classList.add("hidden");
        document.getElementById("chat-ui").classList.remove("hidden");
        initChat();
      } else {
        document.getElementById("loginMsg").textContent = "Wrong password.";
      }
    };

    // Settings toggle
    const settingsToggle = document.getElementById("settingsToggle");
    const settingsPanel = document.getElementById("settingsPanel");
    settingsToggle.addEventListener("click", () => {
      settingsPanel.classList.toggle("hidden");
      settingsToggle.textContent = settingsPanel.classList.contains("hidden") ? "Show Settings" : "Hide Settings";
    });

    // Voices + TTS controls
    let voices = [];
    let volume = 1.0;
    let muted  = false;

    function loadVoices() {
      voices = speechSynthesis.getVoices();
      const sel = document.getElementById("voiceSelect");
      sel.innerHTML = voices.map((v,i) => `<option value="${i}">${v.name} (${v.lang})</option>`).join("");
    }
    document.getElementById("volumeSlider").addEventListener("input", (e) => {
      volume = parseFloat(e.target.value);
    });
    document.getElementById("muteBtn").addEventListener("click", () => {
      muted = !muted;
      document.getElementById("muteBtn").textContent = muted ? "Unmute" : "Mute";
    });

    // Crypto helpers
    function arrayBufferToBase64(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer)));
    }
    function base64ToArrayBuffer(base64) {
      const bin = atob(base64), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr.buffer;
    }
    async function deriveKey() {
      const enc     = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(CHAT_PASSPHRASE), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode(SALT), iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt","decrypt"]
      );
    }
    async function encrypt(text) {
      const key = await deriveKey();
      const iv  = crypto.getRandomValues(new Uint8Array(12));
      const ct  = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text));
      return { iv: arrayBufferToBase64(iv), ct: arrayBufferToBase64(ct) };
    }
    async function decrypt(ivB64, ctB64) {
      const key = await deriveKey();
      const iv  = base64ToArrayBuffer(ivB64);
      const ct  = base64ToArrayBuffer(ctB64);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
      return new TextDecoder().decode(plain);
    }

    function initChat() {
      loadVoices();
      speechSynthesis.onvoiceschanged = loadVoices;
      onChildAdded(chatRef, handleInbound);
      document.getElementById("chatForm").addEventListener("submit", handleSend);
      document.getElementById("imageForm").addEventListener("submit", handleImageSend);
      setupAutoDelete();
      setupDrag();
    }

    async function handleSend(e) {
      e.preventDefault();
      const user       = document.getElementById("username").value.trim();
      const msg        = document.getElementById("message").value.trim();
      const voiceIndex = document.getElementById("voiceSelect").value;
      if (!user || !msg) return;
      const fullText = `${user}: ${msg}`;
      const { iv, ct } = await encrypt(fullText);
      const uid = auth.currentUser?.uid || "unknown";
      await push(chatRef, { iv, ct, voiceIndex, timestamp: Date.now(), type:"text", uid });
      document.getElementById("message").value = "";
    }

    async function handleImageSend(e) {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const link = document.getElementById("imageLink").value.trim();
      if (!user || !link) return;
      const { iv, ct } = await encrypt(`${user}: ${link}`);
      const uid = auth.currentUser?.uid || "unknown";
      await push(chatRef, { iv, ct, voiceIndex: -1, timestamp: Date.now(), type:"image", uid });
      document.getElementById("imageLink").value = "";
    }

    async function handleInbound(snap) {
      const { iv, ct, voiceIndex, type } = snap.val();
      if (!iv || !ct) return;
      try {
        const fullText = await decrypt(iv, ct);
        const splitAt  = fullText.indexOf(": ");
        const spoken   = splitAt > -1 ? fullText.slice(splitAt + 2) : fullText;

        const chatDiv = document.getElementById("chat");

        if (type === "image") {
          const img = document.createElement("img");
          img.src = spoken;
          img.alt = "Shared image";
          img.style.maxWidth = "200px";
          img.style.display = "block";
          img.style.marginTop = "6px";
          chatDiv.appendChild(img);
          chatDiv.scrollTop = chatDiv.scrollHeight;
          return;
        }

        const p = document.createElement("p");
        p.classList.add("message");
        p.textContent = fullText;
        chatDiv.appendChild(p);
        chatDiv.scrollTop = chatDiv.scrollHeight;

        const utter = new SpeechSynthesisUtterance(spoken);
        utter.voice = voices[voiceIndex] || null;
        utter.volume = muted ? 0 : volume;
        speechSynthesis.speak(utter);
      } catch (err) {
        console.warn("Decrypt failed:", err);
      }
    }

    // Auto-delete toggle (60s countdown -> delete all messages -> repeat until stopped)
    let autoDeleteActive = false;
    let countdownInterval = null;
    let countdown = 60;

    function setupAutoDelete() {
      const btn = document.getElementById("autoDeleteBtn");
      const display = document.getElementById("countdownDisplay");

      btn.addEventListener("click", () => {
        autoDeleteActive = !autoDeleteActive;
        if (autoDeleteActive) {
          btn.textContent = "Stop Auto-Delete";
          startCountdownLoop(display);
        } else {
          btn.textContent = "Start Auto-Delete";
          stopCountdownLoop(display);
        }
      });
    }

    function startCountdownLoop(display) {
      countdown = 60;
      display.textContent = `Deleting in ${countdown}s`;
      clearInterval(countdownInterval);
      countdownInterval = setInterval(async () => {
        countdown--;
        display.textContent = `Deleting in ${countdown}s`;
        if (countdown <= 0) {
          try { await remove(chatRef); } catch (e) { console.warn("Delete failed:", e); }
          countdown = 60;
          display.textContent = `Deleting in ${countdown}s`;
        }
      }, 1000);
    }

    function stopCountdownLoop(display) {
      clearInterval(countdownInterval);
      countdownInterval = null;
      display.textContent = "";
    }

    // Dragging for chat window using header as handle
    function setupDrag() {
      const win = document.getElementById("chatWindow");
      const header = document.getElementById("chatHeader");
      let isDragging = false;
      let startX = 0, startY = 0, startLeft = 0, startTop = 0;

      // Ensure starting position is fixed for dragging
      const rect = win.getBoundingClientRect();
      win.style.left = rect.left + "px";
      win.style.top  = rect.top  + "px";

      header.addEventListener("mousedown", (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startLeft = parseFloat(win.style.left || 0);
        startTop  = parseFloat(win.style.top  || 0);
        document.addEventListener("mousemove", onDragMove);
        document.addEventListener("mouseup", onDragEnd);
      });

      function onDragMove(e) {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        win.style.left = startLeft + dx + "px";
        win.style.top  = startTop  + dy + "px";
      }

      function onDragEnd() {
        isDragging = false;
        document.removeEventListener("mousemove", onDragMove);
        document.removeEventListener("mouseup", onDragEnd);
      }
    }

    // Clear speech queue when leaving page
    window.addEventListener("beforeunload", () => speechSynthesis.cancel());
  </script>
</body>
</html>
