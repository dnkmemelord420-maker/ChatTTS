<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TTS Encrypted Chat (Secure)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>TTS Encrypted Chat</h1>

    <!-- AUTH -->
    <div id="auth">
      <input id="email" type="email" placeholder="Email" required />
      <input id="password" type="password" placeholder="Password" required />
      <button id="signInBtn">Sign in</button>
      <button id="signUpBtn">Create account</button>
      <p id="authMsg" class="error"></p>

      <!-- Optional: Room password used ONLY for E2E encryption key derivation -->
      <input id="roomPwd" type="password" placeholder="Room password (E2E key)" />
      <p class="tip">Sign-in controls access. Room password only affects encryption.</p>
    </div>

    <!-- CHAT UI -->
    <div id="chat-ui" class="hidden">
      <div id="controls">
        <label>
          Voice
          <select id="voiceSelect"></select>
        </label>
      </div>
      <div id="chat"></div>

      <form id="chatForm">
        <input id="username" type="text" placeholder="Your name" required maxlength="30" />
        <input id="message" type="text" placeholder="Type a message…" required maxlength="200" />
        <button type="submit">Send</button>
      </form>
      <br>
      <form id="imageForm">
        <input id="imageLink" type="url" placeholder="Paste image link…" required />
        <button type="submit">Send Image</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import {
      getDatabase, ref, push, onChildAdded
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
    import {
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANG_bgIZ0sdpenEZdLU6zqAUvLpk2RH8s",
      authDomain: "chattts-574ab.firebaseapp.com",
      databaseURL: "https://chattts-574ab-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "chattts-574ab",
      storageBucket: "chattts-574ab.appspot.com",
      messagingSenderId: "848479057506",
      appId: "1:848479057506:web:a2dd895d7a7991387d433b"
    };

    // Room configuration (one room example). You can route by URL param.
    const ROOM_ID = "friends-room-1";

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getDatabase(app);

    const roomPwdInput = document.getElementById("roomPwd");
    let voices = [];
    let encKeyPromise = null;

    // Derive E2E key from room password (not hardcoded)
    async function deriveKeyFromRoomPwd(roomPwd) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(roomPwd), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode(ROOM_ID), iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt","decrypt"]
      );
    }

    function arrayBufferToBase64(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer)));
    }
    function base64ToArrayBuffer(base64) {
      const bin = atob(base64), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr.buffer;
    }

    async function encrypt(text) {
      const roomPwd = roomPwdInput.value;
      if (!roomPwd) throw new Error("Enter room password (for encryption).");
      encKeyPromise ||= deriveKeyFromRoomPwd(roomPwd);
      const key = await encKeyPromise;

      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text));
      return { iv: arrayBufferToBase64(iv), ct: arrayBufferToBase64(ct) };
    }

    async function decrypt(ivB64, ctB64) {
      const roomPwd = roomPwdInput.value;
      if (!roomPwd) throw new Error("Enter room password (to decrypt).");
      encKeyPromise ||= deriveKeyFromRoomPwd(roomPwd);
      const key = await encKeyPromise;

      const iv = base64ToArrayBuffer(ivB64);
      const ct = base64ToArrayBuffer(ctB64);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
      return new TextDecoder().decode(plain);
    }

    // UI
    document.getElementById("signInBtn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const pwd   = document.getElementById("password").value;
      const msgEl = document.getElementById("authMsg");
      try {
        await signInWithEmailAndPassword(auth, email, pwd);
        msgEl.textContent = "";
      } catch (e) {
        msgEl.textContent = "Sign-in failed.";
      }
    };

    document.getElementById("signUpBtn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const pwd   = document.getElementById("password").value;
      const msgEl = document.getElementById("authMsg");
      try {
        await createUserWithEmailAndPassword(auth, email, pwd);
        msgEl.textContent = "Account created. Signed in.";
      } catch (e) {
        msgEl.textContent = "Sign-up failed.";
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("auth").classList.add("hidden");
        document.getElementById("chat-ui").classList.remove("hidden");
        initChat();
      } else {
        document.getElementById("chat-ui").classList.add("hidden");
        document.getElementById("auth").classList.remove("hidden");
      }
    });

    function initChat() {
      loadVoices();
      loadDarkMode();
      speechSynthesis.onvoiceschanged = loadVoices;

      const chatRef = ref(db, `messages/${ROOM_ID}`);
      onChildAdded(chatRef, handleInbound);

      document.getElementById("chatForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const user = document.getElementById("username").value.trim();
        const msg  = document.getElementById("message").value.trim();
        const voiceIndex = document.getElementById("voiceSelect").value;
        if (!user || !msg) return;
        const fullText = `${user}: ${msg}`;
        try {
          const { iv, ct } = await encrypt(fullText);
          await push(chatRef, { iv, ct, voiceIndex, timestamp: Date.now(), type:"text" });
          document.getElementById("message").value = "";
        } catch (err) {
          alert(err.message);
        }
      });

      document.getElementById("imageForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const user = document.getElementById("username").value.trim();
        const link = document.getElementById("imageLink").value.trim();
        if (!user || !link) return;
        try {
          const { iv, ct } = await encrypt(`${user}: ${link}`);
          await push(ref(db, `messages/${ROOM_ID}`), {
            iv, ct, voiceIndex: -1, timestamp: Date.now(), type:"image"
          });
          document.getElementById("imageLink").value = "";
        } catch (err) {
          alert(err.message);
        }
      });
    }

    function loadVoices() {
      voices = speechSynthesis.getVoices();
      const sel = document.getElementById("voiceSelect");
      sel.innerHTML = voices.map((v,i) => `<option value="${i}">${v.name} (${v.lang})</option>`).join("");
    }

    function loadDarkMode() {
      const dark = localStorage.getItem("darkMode") === "true";
      document.body.classList.toggle("dark", dark);
    }
  </script>
</body>
</html>
